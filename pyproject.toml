[project]
name = "prior-auth-agents"
version = "0.1.0"
description = "Healthcare prior-authorization with MCP tool servers, A2A agent-to-agent messaging, PHI controls and human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Balaji Krishnamoorthy" }]
dependencies = [
  "mcp>=2.3,<3",
  "a2a-sdk[http-server]>=1.3,<2",
  "langgraph>=0.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
priorauth = "priorauth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorauth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["priorauth", "conftest"]
